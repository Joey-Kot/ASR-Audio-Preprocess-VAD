name: Build
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'latest-release' }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.99.1
jobs:
  linux:
    name: Build (linux-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool patch pkg-config curl xz-utils tar
      - name: Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
      - name: Audio dependencies
        run: ./scripts/bootstrap-static-audio-deps.sh
      - name: Test and build
        run: |
          export PKG_CONFIG_PATH="$PWD/third_party/ffmpeg-audio/lib/pkgconfig"
          ./scripts/tests/patch-application.sh third_party/src/ffmpeg-8.1.3
          ./scripts/test-ffmpeg-security.sh
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          ./scripts/check-independent-consumer.sh
          cargo package --locked --allow-dirty
          cargo build --locked --release
      - name: Runtime check
        run: |
          mkdir -p runtime-check-tmp
          PATH="$PWD/runtime-check-tmp" ./target/release/smartaudio preconvert \
            --input tests/fixtures/jfk.flac --output runtime-check-tmp/check.ogg
          ldd target/release/smartaudio
          if ldd target/release/smartaudio | grep -E 'libav(codec|format|util)|libswresample|libopus|libmp3lame'; then exit 1; fi
      - name: Package
        run: ./scripts/package-rust.sh "${{ matrix.target }}" target/release/smartaudio
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: smartaudio-linux-${{ matrix.arch }}
          path: dist/smartaudio-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error
  windows:
    name: Build (windows-${{ matrix.display_arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-gnu
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            compiler: gcc
            arch: x86_64
            host: x86_64-w64-mingw32
            display_arch: x86_64
            opus_flags: ''
          - runner: windows-11-arm
            target: aarch64-pc-windows-gnullvm
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64
            compiler: clang
            arch: aarch64
            host: aarch64-w64-mingw32
            display_arch: arm64
            opus_flags: --disable-rtcd --disable-asm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          install: >-
            base-devel autoconf automake libtool make patch curl tar xz zip
            ${{ matrix.prefix }}-pkgconf ${{ matrix.prefix }}-toolchain
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain "$RUST_VERSION" "${{ matrix.target }}"
      - name: Audio dependencies
        env:
          CC: ${{ matrix.compiler }}
          FFMPEG_CONFIGURE_FLAGS: --arch=${{ matrix.arch }} --target-os=mingw32
          OPUS_CONFIGURE_FLAGS: ${{ matrix.opus_flags }}
          DEPENDENCY_CONFIGURE_FLAGS: --host=${{ matrix.host }} --build=${{ matrix.host }}
        run: ./scripts/bootstrap-static-audio-deps.sh
      - name: Test and build
        env:
          CC: ${{ matrix.compiler }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: clang
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-static
        run: |
          export PKG_CONFIG_PATH="$PWD/third_party/ffmpeg-audio/lib/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1
          ./scripts/tests/patch-application.sh third_party/src/ffmpeg-8.1.3
          ./scripts/test-ffmpeg-security.sh
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          ./scripts/check-independent-consumer.sh
          cargo build --locked --release
          ./target/${{ matrix.target }}/release/smartaudio.exe --version
      - name: Package
        run: ./scripts/package-rust.sh "${{ matrix.target }}" "target/${{ matrix.target }}/release/smartaudio.exe"
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: smartaudio-windows-${{ matrix.display_arch }}
          path: dist/smartaudio-windows-${{ matrix.display_arch }}.zip*
          if-no-files-found: error
  macos:
    name: Build (macos-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Build tools
        run: |
          brew install autoconf automake libtool pkgconf coreutils gnu-tar make xz
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Rust
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
      - name: Audio dependencies
        run: ./scripts/bootstrap-static-audio-deps.sh
      - name: Test and build
        run: |
          export PKG_CONFIG_PATH="$PWD/third_party/ffmpeg-audio/lib/pkgconfig"
          ./scripts/tests/patch-application.sh third_party/src/ffmpeg-8.1.3
          ./scripts/test-ffmpeg-security.sh
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          ./scripts/check-independent-consumer.sh
          cargo package --locked --allow-dirty
          cargo build --locked --release
      - name: Runtime check
        run: |
          mkdir -p runtime-check-tmp
          PATH="$PWD/runtime-check-tmp" ./target/release/smartaudio preconvert \
            --input tests/fixtures/jfk.flac --output runtime-check-tmp/check.ogg
          otool -L target/release/smartaudio
          if otool -L target/release/smartaudio | grep -E 'libav(codec|format|util)|libswresample|libopus|libmp3lame|libvorbis|libogg|libspeex|libopencore-amr|libvo-amrwbenc'; then exit 1; fi
      - name: Package
        run: ./scripts/package-rust.sh "${{ matrix.target }}" target/release/smartaudio
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: smartaudio-macos-${{ matrix.arch }}
          path: dist/smartaudio-macos-${{ matrix.arch }}.zip*
          if-no-files-found: error
  publish:
    name: Publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: smartaudio-*
          path: release-assets
          merge-multiple: true
      - name: Move Latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f Latest "$GITHUB_SHA"
          git push origin refs/tags/Latest --force
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Automated build from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. All six native targets passed."
          if gh release view Latest; then
            gh release edit Latest --title "Latest" --notes "$notes" --latest
          else
            gh release create Latest --title "Latest" --notes "$notes" --latest
          fi
          gh release upload Latest release-assets/* --clobber
